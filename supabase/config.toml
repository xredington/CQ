project_id = "codehive"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Magic links expire in 15 minutes (brief §6).
jwt_expiry = 3600

[auth.email]
enable_signup = true # required for signInWithOtp to create the auth user; the
                     # allowlist check in the login server action gates access
enable_confirmations = false
otp_expiry = 900

[inbucket]
enabled = true
port = 54324
